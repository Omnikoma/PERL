# ==========================================================================
# PERL — KuaiRec configuration.
# ==========================================================================
dataset: kuairec
seed: 42

paths:
  processed_dir: processed/kuairec       # output of dataprocessing.py
  checkpoint_dir: checkpoints/kuairec
  # Self-contained TimesFM: source is vendored in third_party/timesfm and weights in
  # weights/timesfm-2.5-200m-pytorch (model.safetensors). Both paths are resolved to
  # absolute relative to the project root by perl/config.py.
  timesfm_src: third_party               # dir added to sys.path so `import timesfm` resolves
  timesfm_model_dir: weights/timesfm-2.5-200m-pytorch

# ---- core model hyperparameters -----------------------------------------
model:
  embed_dim: 128            # unified embedding dim d
  K: 20                     # retrieved historical analogs
  w: 5                      # lifecycle causal-window length
  K_P: 4                    # number of population prototypes
  tau_con: 0.1              # CECL contrastive temperature
  tau_M: 0.1                # metadata retrieval softmax temperature
  tau_P: 0.1                # prototype-assignment softmax temperature
  rho_max: 64               # normalization constant for rho~ (max lifecycle position)
  d_x: 16                   # number of behavioral channels (set by dataprocessing)
  user_hist_len: 50         # recent items used for e_{u,t}

# ---- Path A: TimesFM encoder --------------------------------------------
path_a:
  encoder: lora_tsfm        # one of: gru | tcn | transformer | frozen_tsfm | lora_tsfm
  patch_len: 32             # TimesFM input patch length (fixed by the checkpoint)
  hidden_size: 1280         # TimesFM model dim (output_embeddings width)
  lora_r: 8                 # LoRA rank
  lora_alpha: 16
  lora_dropout: 0.1
  lora_target_modules: [qkv_proj]   # fused QKV projection in TimesFM 2.5
  max_prefix_len: 64        # cap on observed prefix length fed to TimesFM (multiple of 32);
                            # KuaiRec item lifespan <= 63 days, so 64 covers full prefixes.
  tsfm_microbatch: 1024     # sub-batch of (B*d_x) series per TimesFM forward (memory bound)

# ---- losses --------------------------------------------------------------
loss:
  lambda_con: 0.1           # CECL weight
  lambda_unc: 0.1           # uncertainty-calibration weight
  lambda_reg: 1.0e-5        # L2 weight

# ---- optimisation --------------------------------------------------------
optim:
  lr: 1.0e-3                # Adam initial LR
  batch_size: 64            # NOTE: TimesFM sees batch_size*d_x series, so keep modest
                            # (64*16=1024). Raise if GPU memory allows; see README.
  max_epochs: 50
  early_stop_patience: 5
  grad_clip: 1.0
  num_workers: 4

# ---- evaluation ----------------------------------------------------------
eval:
  num_candidate_negatives: 99   # per positive, for HR@10 / NDCG@10
  topk: 10
  stages: {G1: [0, 3], G2: [4, 7], G3: [8, 14], G4: [15, 1000000000]}

# ---- ablation switches — all default off / default variant ---------------
ablation:
  no_lifecycle_align: false          # shorthand for align_strategy: whole_trajectory
  no_population: false
  no_temporal: false
  no_collaborative: false
  no_uncertainty: false
  no_progressive: false              # shorthand for fusion_strategy: concat
  no_cecl: false
  align_strategy: lifecycle_causal   # whole_trajectory | calendar | symmetric | lifecycle_causal
  population_prior: prototypes       # prototypes | single_mean
  fusion_strategy: progressive       # mean | concat | reliability | progressive
